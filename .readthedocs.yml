# ReadTheDocs configuration for the MyST build.
# Pattern from https://mystmd.org/guide/deployment-readthedocs (build.commands, no Sphinx).
# RTD reads this file from the branch it builds, so it only affects builds of this branch.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  commands:
    - pip install uv
    - uv sync --locked --group migration
    - cd docs/source && uv run myst build --html
    - uv run python migration/gen_redirects.py --html docs/source/_build/html
    - mkdir -p $READTHEDOCS_OUTPUT/html/
    - cp -r docs/source/_build/html/. $READTHEDOCS_OUTPUT/html/
